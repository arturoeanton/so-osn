# Timeout in seconds that Limine will use before automatically booting.
timeout: 3

# The entry name that will be displayed in the boot menu.
/OSnOS
    # We use the Limine boot protocol.
    protocol: limine

    # Framebuffer mode (FASE 15.2/15.3 premium pass). 1440x900 fits
    # 1:1 inside a 13" MacBook display in points (1470x956), so with
    # QEMU's plain cocoa display (no zoom-to-fit — see
    # build_and_run.sh) macOS applies a clean integer Retina scale:
    # crisp pixels, and no scaled-redraw flicker while the cursor
    # moves. Bump to 1920x1080x32 on bigger monitors. Limine falls
    # back to the closest available mode.
    resolution: 1440x900x32

    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    path: boot():/boot/kernel
